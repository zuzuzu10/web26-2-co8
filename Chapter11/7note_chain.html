<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    
</head>
<script>
    // 이벤트를 연결합니다.
    $(document).ready(function () {
        // 속성을 지정합니다.
        $('img').attr('alt', 'jQuery 라이브러리를 사용한 속성 지정')
            .attr('src', 'http://via.placeholder.com/100x100')
            .attr('width', '100');
    });
</script>
<body> 
    <img>
    <img>
    <img>

<hr/>
<h2>메서드 체이닝:</h2> 
$( ) 함수를 여러 번 사용할 필요 없이 메서드를 연속해서 사용할 수 있음.
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    
</head>
<script>
    $(document).ready(function () {
        // 스타일을 변경합니다.
        $('#box').css({
            width: 100,
            height: 100,
            background: 'red',
            position: 'absolute',
            left: 10,
            top: 10
        }).animate({
            height: '+=300',
            width: '-=50',
            left: '+=300',
            opacity: 0.5
        }, 500);
    });
</script>
<body>
    <h2>05 시각 효과</h2>
    <h4>5.1시각 효과 메서드</h4>
    <h4><b>5.2애니메이션 효과</b></h4>
    <hr>

    
    <div id="box"></div>
</body>

</html>

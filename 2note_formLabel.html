<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2note_form</title>
</head>
<body>
    <form>
        <table border="1">
      <tr>
      <td><label for="name">이름</label></td>
      <td><input id="name" type="text" name="name"></td>
      </tr>
      <tr>
        <td>성별</td>

            <input id="woman" type="radio" name="gender" value="w">
            <label for="woman">여자</label>
        </td>
      </tr>
    </table>
    <input type="submit" value="가입">
    </form>
</body>
</html>

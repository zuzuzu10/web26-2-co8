<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
</head>
<script>
  // 변수를 선언합니다.
  let output = 0;

  // 반복을 수행합니다.
  for (let i = 0; i <= 100; i++) {
    output += i;
  }

  // 출력합니다.
  alert(output);
</script>
<body>
    for반복문을 사용한 0부터 100까지 합 계산<hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>
</html>

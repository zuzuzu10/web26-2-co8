<!DOCTYPE html>
<html lang="ko">
<head>
    <style>

    h1:hover { color: red;}
    h2:action { color: blue;}

    /*input 태그가 사용 가능할 때 background-color속성에 white키워드를 적용함. */
    input:enabled { background-color: white;}
     /*input 태그가 사용 가능할 때 background-color속성에 gray키워드를 적용함. */
    input:disabled { background-color: gray;}
     /*input 태그가 사용 가능할 때 background-color속성에 orange키워드를 적용함. */
    input:focus { background-color: orangeyellow; }
    </style>
</head>
<body>
     <h2>5.1 반응 선택자</h2>
    <h2>5.2 상태 선택자</h2>
    <hr>

     <h2> 사용 가능 </h2>
    <input>
    <h2> 사용 불가능 </h2>
    <input disabled="disabled">

    
</body>
</html>

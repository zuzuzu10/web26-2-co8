<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>4form_selectBasic</title>
</head>
<body>
    <h2>1개 항목만 선택 가능한 입력 양식</h2>
    <select>
        <option>초밥</option>
        <option>계란초밥</option>
        <option>육회초밥</option>
        <option>마라샹궈</option>
    </select>
    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>초밥</option>
        <option>계란초밥</option>
        <option>육회초밥</option>
        <option>마라샹궈</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <select>
        <optgroup label="HTML5">
        <option>Multimedia Tag</option>
        <option>Connetivity</option>
        <option>Device Access</option>
    </optgroup>
     <optgroup label="CSS3">
            <option>Animation</option>
            <option>3D Transform</option>
     </optgroup>
    </select>
</body>
</html>

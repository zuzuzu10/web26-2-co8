<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CSS3 Selector Basic</title>
    <style>
        .header { background-color: rgb(23, 99, 212);}
        .item { color: rgb(151, 245, 213);}
        .select { color: rgb(115, 124, 230);}
        .s { color: rgb(133, 212, 238);}
        .b { color: rgb(86, 206, 96);}
        .c { color: rgb(216, 177, 203);}
    </style>
</head>
<body>
    <h2>1. 전체 선택자</h2>
    <h2 id="rint">2. 태그 선택자</h2>
    <h2 id="rint">3. 아이디 선택자</h2>
    <h2>4. id속성을 중복 사용하면 해당 id 속성을 표시한 모두에게 적용이 된다.</h2>
    <h2>5. 클래스 선택자</h2>
    <!--id는 그냥 한 개만 쓰고 여러 개를 사용할거면 class로 사용하자-->
    <hr>
 
    <h1 class="item header">우레우레우레우레우루야하우리삐잇우나나우레우레룽루에우레삐빠레삐더빠레우루루우레레우루우레</h1>

    <ul>
        <li class="select">우나나 우나이햐 우레삐이 치리치리뱅뱅</li>
        <li class="s">우냐냐우레우레뿌ㅇ루레 </li>
        <li class="b">이랏샤이마세</li>
        <li class="c">우루이햐</li> 
    </ul>
    <div id="header">
        <h1>#header 태그</h1>
    </div>
    <div id="wrap">
        <div id="asdie"></div>
        <h1>#aside 태그</h1>
    </div>
    <div id="content">
        <h1>#content 태그</h1>
    </div>
    
</body>
</html>

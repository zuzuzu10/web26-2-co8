<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>3.구조 선택자</title>
    <style>
        /* 모든 a태그에 빨간색이 적용?!
        => li 태그의 첫번째 지손에 해당하는 a태그를 선택했으므로,
                        a태그 5개가 전부 이 조건에 해당됨.*/
       
        li:first-child > a{color: red;}
    </style>
</head>
<body>
    <u1>
        <li><a href="#">주의 사항</a></li>
        <li><a href="#">주의 사항</a></li>
        <li>
            <a href="#">주의 사항</a>
            <a href="#">주의 사항</a>
        </li>
        <li><a href="#">주의 사항</a></li>
        <li><a href="#">주의 사항</a></li>
    </u1>
</body>
</html>
